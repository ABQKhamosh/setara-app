name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find project folder
        id: proj
        run: |
          P=$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -1)")
          echo "Project folder: $P"
          echo "dir=$P" >> "$GITHUB_OUTPUT"

      - name: Generate android folder
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir /tmp/backup
          cp -r lib pubspec.yaml /tmp/backup/
          flutter create . --platforms=android --project-name setara_app --org com.setara
          rm -rf lib pubspec.yaml
          cp -r /tmp/backup/lib /tmp/backup/pubspec.yaml .

      - name: Get packages
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: setara-apk
          path: ${{ steps.proj.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
